# The website (booking page, ride links, back office screens) on GitHub Pages: https://<user>.github.io/<repo>/
# The server (API + database) runs elsewhere: set the repository variable API_URL to its address
# (Settings › Secrets and variables › Actions › Variables), e.g. https://152-67-12-34.sslip.io
name: Website on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Export the website
        working-directory: apps/mobile
        env:
          # Served under /<repo>; with your own domain on Pages, set the variable BASE_URL to "/".
          EXPO_BASE_URL: ${{ vars.BASE_URL || format('/{0}', github.event.repository.name) }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: npx expo export --platform web --output-dir ../../site
      - name: Deep links (/b/…, /admin) open the app too
        run: cp site/index.html site/404.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
