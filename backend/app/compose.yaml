# Local PostgreSQL, Kafka and Mailpit, started automatically by `./gradlew :app:bootRun` (Spring Boot Docker Compose support).
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=taxi'
      - 'POSTGRES_USER=taxi'
      - 'POSTGRES_PASSWORD=taxi'
    ports:
      - '5432'

  # Every email the app sends in development lands here instead of real inboxes: http://localhost:8025
  # (Mailpit, MIT licence; the maintained successor of MailHog). SMTP on localhost:1026.
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1026:1025'
      - '8025:8025'

  # Event broker (Apache Kafka, KRaft single node). Spring Boot has no Docker Compose service connection for Kafka,
  # so the port is fixed: the app (dev profile) connects to localhost:19092.
  # See the messages: docker compose -p app exec kafka /opt/kafka/bin/kafka-console-consumer.sh
  #   --bootstrap-server localhost:9092 --topic taxi.ride-events --from-beginning
  kafka:
    image: 'apache/kafka:4.3.1'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,HOST://:19092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,HOST://localhost:19092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1'
      - 'KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1'
      - 'KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0'
      - 'KAFKA_NUM_PARTITIONS=3'
      - 'KAFKA_LOG_DIRS=/var/lib/kafka/data'
      - 'KAFKA_HEAP_OPTS=-Xmx384m -Xms384m'
    ports:
      - '19092:19092'
    volumes:
      - 'kafkadata:/var/lib/kafka/data'
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
      start_interval: 3s

volumes:
  kafkadata:
