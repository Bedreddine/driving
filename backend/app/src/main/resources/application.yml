spring:
  application:
    name: taxi
  jackson:
    # The app sends and reads snake_case JSON (pickup_at, ride_id...).
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taxi}
    username: ${DATABASE_USER:taxi}
    password: ${DATABASE_PASSWORD:taxi}
  flyway:
    locations: classpath:db/migration
  mail:
    # Customer emails go through any SMTP server, set with environment variables:
    # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
    # Without SPRING_MAIL_HOST, emails are not sent (logged with a masked recipient; full text at DEBUG, dev profile).
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  http:
    clients:
      # Calls to outside services (Expo push...) give up instead of hanging.
      connect-timeout: 5s
      read-timeout: 15s
  servlet:
    multipart:
      # Driver and car photo uploads: the app itself refuses over 3 MB (IMAGE_TOO_LARGE); this outer limit is only a backstop.
      max-file-size: 5MB
      max-request-size: 6MB
  task:
    scheduling:
      pool:
        # Background jobs run side by side: a slow mail server never holds up expiry or reminders.
        size: 4
  docker:
    compose:
      # `./gradlew :app:bootRun` starts PostgreSQL from app/compose.yaml automatically (development only).
      lifecycle-management: start-only

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Behind a reverse proxy (production), read the visitor's IP from X-Forwarded-For (used by the booking limits).
  # Only safe when the proxy is the only way in and sets the header itself (docker/nginx.conf replaces whatever the
  # visitor sent).
  forward-headers-strategy: ${FORWARD_HEADERS:native}

taxi:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Browser origins of the back office, comma separated (e.g. https://admin.example.com)
    cors-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}
  routing:
    # Public demo server: fine for testing. Run your own OSRM for real traffic.
    osrm-url: ${OSRM_URL:https://router.project-osrm.org}
  push:
    enabled: ${PUSH_ENABLED:true}
  mail:
    # Sender address of customer emails (the SMTP server is set with SPRING_MAIL_*, see spring.mail above).
    from: ${MAIL_FROM:no-reply@localhost}
    reply-to: ${MAIL_REPLY_TO:}
  auth:
    # Against password guessing and scripted sign-ups.
    max-signups-per-hour: 10
    max-logins-per-hour: 50
    max-logins-per-account-per-15-min: 10
    # Token renewals (and sign-outs) per visitor IP: an app renews about every 15 minutes.
    max-refreshes-per-hour: 300
  public:
    # Address of the booking website, used in emailed links while none is set in the back office.
    site-url: ${SITE_URL:}
    # Booking website (QR code) limits per visitor IP and per hour, against spam.
    max-bookings-per-hour: 10
    max-quotes-per-hour: 60
    max-reviews-per-hour: 20
    # Live driver position on the ride page, per visitor IP and per minute (the page polls every 5 s).
    max-tracking-per-minute: 60
    # Private ride page (/b/<token>: view, answer a price, cancel, messages, browser push) per visitor IP and per
    # hour (it reloads every 30 s).
    max-ride-page-per-hour: 600
    # Messages a client sends from one ride link, per 10 minutes.
    max-messages-per-10-min: 20
  web-push:
    # Browser push for guests (standard Web Push, free). Make a key pair once with
    # `java -jar app.jar --taxi.generate-vapid` and keep it (browsers subscribed with one key only accept that key).
    # Without keys browser push is off; the dev profile makes temporary keys at startup.
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    # Contact for the push services in case of problems: mailto: or https: address.
    subject: ${VAPID_SUBJECT:mailto:no-reply@localhost}
  driver:
    # Position updates from the driver's phone: about one per second, small bursts allowed.
    max-location-updates-per-5s: 5
  sms:
    # SMS always costs money per message. Off until a provider is chosen (texts are only logged).
    enabled: ${SMS_ENABLED:false}

management:
  health:
    mail:
      # A mail server being down must not mark the whole app unhealthy (emails are retried by the outbox).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,modulith
