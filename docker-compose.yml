# Runs the whole app: database, backend API and website.
#   ./scripts/docker-env.sh   (creates .env with random secrets; or copy .env.example and fill it in)
#   docker compose up -d --build
# Website + API: http://localhost:${WEB_PORT:-8080}  (put HTTPS in front in production, see README)

# Container logs (they include visitors' IP addresses): kept small and short-lived, 3 files of 10 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Event broker: ride changes, moments, messages, reviews and erasures go from the booking side to the notification
  # side through Kafka (see README, "Events and Kafka"). Single node in KRaft mode (no ZooKeeper), Apache 2.0 image.
  # Needs about 500 MB of RAM (384 MB Java heap). Not published on the host: only the backend talks to it.
  kafka:
    logging: *logging
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker: one copy of everything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The app creates its topics at startup (3 partitions, kept 7 days). Should Kafka still be starting then,
      # a topic made on first use gets the same 3 partitions.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # The broker answers API requests (the check's own Java gets a small heap).
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
      start_interval: 3s

  backend:
    logging: *logging
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/taxi
      DATABASE_USER: taxi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${SITE_URL:-http://localhost:8080}
      FORWARD_HEADERS: framework # behind nginx: real visitor IP for the anti-spam limits
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      PUSH_ENABLED: ${PUSH_ENABLED:-true}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Browser push for guests (made by ./scripts/docker-env.sh; empty = browser push off)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@localhost}
    # No port published: only reachable through the website's nginx.

  web:
    logging: *logging
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional, for trying the whole stack locally: catches every email (http://localhost:8025).
  #   docker compose --profile mail up -d   with SMTP_HOST=mailpit and SMTP_PORT=1025 in .env
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    logging: *logging
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  kafkadata:
