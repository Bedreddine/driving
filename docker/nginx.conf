# One address for everything: the website, the API (/api) and live updates (/ws).
# This file is included inside nginx's http block (conf.d/default.conf), so the map / log_format below are allowed.

# ----------------------------------------------------------------------------------------------- logs
# Private ride links (/b/<token>, /api/public/bookings/<token>) and the access token of /ws?token=... are keys:
# they never go to the access log. Query strings are left out, referrers keep only the site.
map $request_uri $log_uri {
    ~^/b/[^/?]+(?<b_rest>[^?]*)                          "/b/<token>$b_rest";
    ~^/api/public/bookings/[^/?]+(?<p_rest>[^?]*)        "/api/public/bookings/<token>$p_rest";
    ~^(?<path>[^?]*)                                     $path;
}
map $http_referer $log_referer {
    ~^(?<origin>https?://[^/]+)                          $origin;
    default                                              "-";
}
log_format private '$remote_addr - [$time_local] "$request_method $log_uri $server_protocol" $status '
                   '$body_bytes_sent "$log_referer" "$http_user_agent"';

# ----------------------------------------------------------------------------------------------- caching
# Built files have content hashes: cached for long. The API sets its own headers. Every other file: always checked.
map $uri $cache_control {
    ~^/_expo/        "public, max-age=31536000, immutable";
    ~^/api/          "";
    /ws              "";
    default          "no-cache";
}

# ----------------------------------------------------------------------------------------------- security headers
# What the website loads, and from where: its own files and API; map styles, tiles, fonts and sprites from
# OpenFreeMap; address search from Photon (if GEOCODER_URL is changed, change it here too). Road routes (OSRM)
# are asked by the backend, not the browser. MapLibre runs its workers from blob: URLs; react-native-web writes
# inline styles ('unsafe-inline' for styles only, never for scripts).
map $http_host $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host https://tiles.openfreemap.org https://photon.komoot.io blob: data:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    access_log /var/log/nginx/access.log private;

    # Headers for every answer. (add_header is only inherited by locations that have none of their own:
    # keep every add_header here, at server level.)
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    # Other sites only ever see this site's address, never a page path: the private ride link /b/<token>
    # does not leak to the map, tile or address-search servers.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cache-Control $cache_control;
    # (HSTS is added by Caddy, which serves HTTPS; this nginx only speaks plain HTTP.)

    # The API sets some of the same headers (Spring Security): keep only nginx's, so none is sent twice.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    client_max_body_size 1m;

    # The visitor's address for the backend's anti-spam limits. Set, never appended: whatever X-Forwarded-For the
    # visitor sends is dropped, so it cannot be faked to escape the limits. When Caddy is in front (production),
    # deploy/nginx-real-ip.conf makes $remote_addr the address Caddy saw.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Driver and car photo uploads: up to 3 MB (the API answers IMAGE_TOO_LARGE above that, so let it see the request).
    location ~ ^/api/admin/business/(photo|vehicle-photos)$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
    }

    location = /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # proxy_set_header in a location replaces the server-level ones: repeat them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location /_expo/ {
        try_files $uri =404;
    }

    # Every other path is a page of the app (/book, /b/<token>, /admin...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
