# Production only (mounted by deploy/docker-compose.prod.yml next to docker/nginx.conf).
# Caddy is the only way in: it answers the visitors and replaces any X-Forwarded-For they send with the address it
# really sees. nginx takes the visitor's address from Caddy (private Docker addresses) and from nowhere else, then
# passes it on to the backend (docker/nginx.conf), so the anti-spam limits count the real visitor.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# Using your own HTTPS proxy in front of docker-compose.yml instead of Caddy? Mount this file the same way (with your
# proxy's address range) and make the proxy set X-Forwarded-For itself; otherwise every visitor counts as the proxy.
